    <title>ניהול קורס קק"ס</title>
    <!-- the opening screen, before the app's code is here: קק״ס, its ס turning (counterclockwise) while the app loads (lib/session.tsx
         takes it away once there is something to show; the iPhone's launch images draw it still, public/splash) -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #f2f2f7;
        transition: opacity 0.28s ease;
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .kks-logo {
        width: 196px;
        height: auto;
        overflow: visible;
      }
      #boot .kks-k {
        fill: #1c3672;
      }
      #boot .kks-s {
        fill: #3f6fd8;
        transform-origin: 684px 1243.5px;
        animation: kks-turn 1.4s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
      }
      /* counterclockwise */
      @keyframes kks-turn {
        62%,
        100% {
          transform: rotate(-360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) #boot {
          background: #000;
        }
        html:not([data-theme='light']) #boot .kks-k {
          fill: #e8edff;
        }
        html:not([data-theme='light']) #boot .kks-s {
          fill: #8fb0ff;
        }
      }
      html[data-theme='dark'] #boot {
        background: #000;
      }
      html[data-theme='dark'] #boot .kks-k {
        fill: #e8edff;
      }
      html[data-theme='dark'] #boot .kks-s {
        fill: #8fb0ff;
      }
      /* less motion: the ס breathes instead of turning */
      @media (prefers-reduced-motion: reduce) {
        #boot .kks-s {
          animation: kks-breathe 1.6s ease-in-out infinite;
        }
        @keyframes kks-breathe {
          50% {
            opacity: 0.45;
          }
        }
      }
    </style>

  </head>

    </div>
