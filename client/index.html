    <title>ניהול קורס קק"ס</title>
    <!-- Decide before the first paint. Keep this key/threshold aligned with lib/appSession.ts. -->
    <script id="boot-policy">
      (() => {
        const key = 'kks.splash.last-active';
        const day = 24 * 60 * 60 * 1000;
        const now = Date.now();
        let last = 0;
        let available = true;
        try { last = Number(sessionStorage.getItem(key)) || 0; } catch { available = false; }
        const navigation = performance.getEntriesByType?.('navigation')[0]?.type;
        let internal = false;
        try { internal = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch {}
        try { sessionStorage.setItem(key, String(now)); } catch { available = false; }
        const fresh = available ? last <= 0 : navigation !== 'reload' && navigation !== 'back_forward' && !internal;
        document.documentElement.dataset.boot = fresh || (last > 0 && now - last > day) ? 'show' : 'skip';
      })();
    </script>
    <!-- the opening screen, before the app's code is here: קק״ס coming together, and its ס jumping and turning in the air
         (counterclockwise) while the app loads (lib/session.tsx takes it away once there is something to show; the
         iPhone's launch images draw it still, public/splash) -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #f3f2ef;
        transition: opacity 0.28s ease;
      }
      html[data-boot='skip'] #boot { display: none; }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .kks-logo {
        width: 196px;
        height: auto;
        overflow: visible;
      }
      /* קק״ in the ink, the ס in a warm grey, a shadow under it (seen only while it moves) */
      #boot .kks-k,
      #boot .kks-shadow {
        fill: #141413;
      }
      #boot .kks-s {
        fill: #8a867f;
      }
      #boot .kks-shadow {
        opacity: 0;
      }
      /* as it is read: the ק on the right rises into place, then the other, the gershayim drop in one by one,
         and the ס falls from above and lands - then, while the app is on its way, it jumps, turns once in the air
         (counterclockwise), and lands again, its shadow shrinking under it while it is up */
      #boot .kks-q {
        animation: kks-rise 0.52s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      #boot .kks-q2 {
        animation-delay: 0.08s;
      }
      #boot .kks-g {
        animation: kks-tick 0.4s cubic-bezier(0.3, 1.5, 0.5, 1) 0.2s both;
      }
      /* and when the ס lands, the rest of the word feels it */
      #boot .kks-k {
        transform-origin: 3460px 2239px;
        animation: kks-thud 1.6s ease-out 0.95s infinite;
      }
      #boot .kks-g2 {
        animation-delay: 0.27s;
      }
      #boot .kks-hop {
        transform-origin: 684px 1874px;
        animation:
          kks-fall 0.62s cubic-bezier(0.5, 0, 0.6, 1) 0.32s both,
          kks-hop 1.6s ease-in-out 0.95s infinite;
      }
      #boot .kks-s {
        transform-origin: 684px 1243.5px;
        animation: kks-turn 1.6s cubic-bezier(0.45, 0, 0.3, 1) 0.95s infinite;
      }
      #boot .kks-shadow {
        transform-origin: 684px 1934px;
        animation:
          kks-shadow-in 0.62s ease-out 0.32s both,
          kks-shadow 1.6s ease-in-out 0.95s infinite;
      }
      @keyframes kks-rise {
        from {
          opacity: 0;
          transform: translateY(300px);
        }
      }
      @keyframes kks-tick {
        from {
          opacity: 0;
          transform: translateY(-340px);
        }
      }
      @keyframes kks-fall {
        0% {
          opacity: 0;
          transform: translateY(-1100px);
        }
        20% {
          opacity: 1;
        }
        68% {
          transform: translateY(0) scale(1.14, 0.82);
        }
        84% {
          transform: translateY(0) scale(0.96, 1.04);
        }
        100% {
          transform: none;
        }
      }
      @keyframes kks-hop {
        0%,
        100% {
          transform: none;
        }
        10% {
          transform: scale(1.1, 0.86);
        }
        20% {
          transform: translateY(-340px) scale(0.93, 1.09);
        }
        38% {
          transform: translateY(-1000px);
        }
        56% {
          transform: translateY(-340px) scale(0.95, 1.06);
        }
        64% {
          transform: scale(1.13, 0.84);
        }
        74% {
          transform: scale(0.97, 1.03);
        }
        82% {
          transform: none;
        }
      }
      @keyframes kks-thud {
        0%,
        62%,
        80%,
        100% {
          transform: none;
        }
        67% {
          transform: translateY(26px) scale(1, 0.985);
        }
        72% {
          transform: translateY(-8px);
        }
      }
      /* counterclockwise, once, while it is up */
      @keyframes kks-turn {
        0%,
        17% {
          transform: rotate(0deg);
        }
        58%,
        100% {
          transform: rotate(-360deg);
        }
      }
      @keyframes kks-shadow-in {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
        to {
          opacity: 0.14;
        }
      }
      @keyframes kks-shadow {
        0%,
        82%,
        100% {
          opacity: 0.14;
          transform: none;
        }
        10% {
          opacity: 0.16;
          transform: scale(1.1, 1);
        }
        38% {
          opacity: 0.04;
          transform: scale(0.45, 1);
        }
        64% {
          opacity: 0.18;
          transform: scale(1.16, 1);
        }
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) #boot {
          background: #0f0f0e;
        }
        html:not([data-theme='light']) #boot .kks-k,
        html:not([data-theme='light']) #boot .kks-shadow {
          fill: #f3f2ef;
        }
        html:not([data-theme='light']) #boot .kks-s {
          fill: #9a968e;
        }
      }
      html[data-theme='dark'] #boot {
        background: #0f0f0e;
      }
      html[data-theme='dark'] #boot .kks-k,
      html[data-theme='dark'] #boot .kks-shadow {
        fill: #f3f2ef;
      }
      html[data-theme='dark'] #boot .kks-s {
        fill: #9a968e;
      }
      /* less motion: the word is there at once, and the ס breathes instead of jumping */
      @media (prefers-reduced-motion: reduce) {
        #boot .kks-logo * {
          animation: none !important;
        }
        #boot .kks-s {
          animation: kks-breathe 1.6s ease-in-out infinite !important;
        }
        @keyframes kks-breathe {
          50% {
            opacity: 0.45;
          }
        }
      }
    </style>
